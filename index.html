<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>윤희원 | 자기소개</title>
    <style>
        /* 하양색 메인의 미니멀 디자인 */
        body {
            background-color: #ffffff; /* 순백색 배경 */
            color: #1a1a1a; /* 가독성을 위한 진한 회색 */
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.8;
        }

        .container {
            max-width: 450px;
            width: 85%;
            padding: 60px 40px;
            border: 1px solid #f5f5f5; /* 아주 희미한 테두리로 경계만 구분 */
            background-color: #ffffff;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 40px;
            letter-spacing: -0.03em;
            color: #000000;
        }

        .info-section {
            margin-bottom: 25px;
        }

        .label {
            font-size: 0.75rem;
            color: #aaaaaa; /* 라벨은 연하게 처리하여 여백 강조 */
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: block;
            margin-bottom: 6px;
        }

        .content {
            font-size: 1.05rem;
            font-weight: 400;
            word-break: keep-all;
        }

        .highlight {
            color: #444444;
            font-weight: 500;
        }

        .footer {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid #fafafa;
        }

        .greeting {
            font-size: 1.1rem;
            font-weight: 500;
            color: #222222;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>윤희원</h1>
        
        <div class="info-section">
            <span class="label">별명</span>
            <span class="content">hee, 훤</span>
        </div>

        <div class="info-section">
            <span class="label">좋아하는 것</span>
            <span class="content highlight">하양색을 좋아합니다. 아주 많이.</span>
        </div>

        <div class="info-section">
            <span class="label">되새기고자 하는 것</span>
            <span class="content">확신 있는 사람이 되자. 모든 길에는 의미가 있다.</span>
        </div>

        <div class="info-section">
            <span class="label">갖고 싶은 것</span>
            <span class="content">여유</span>
        </div>

        <div class="footer">
            <div class="greeting">
                안녕하세요. 윤희원입니다.<br>잘 부탁드립니다.
            </div>
        </div>
    </div>
</body>
</html>
