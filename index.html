<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>윤희원 | HEE</title>

  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      color: #ffffff;
      background-color: #111111;
      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.22),
          rgba(0, 0, 0, 0.48)
        ),
        url("./background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      padding: 48px;
      overflow: hidden;
    }

    .logo {
      position: absolute;
      top: 18px;
      left: 44px;
      z-index: 2;
      font-size: clamp(8rem, 19vw, 18rem);
      font-weight: 900;
      line-height: 0.78;
      letter-spacing: -0.1em;
      color: rgba(255, 255, 255, 0.97);
      text-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
    }

    .top-image {
      position: absolute;
      top: 48px;
      right: 48px;
      z-index: 3;
      width: 190px;
      height: 190px;
      object-fit: cover;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.38);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
    }

    .bottom-area {
      position: absolute;
      left: 48px;
      right: 48px;
      bottom: 48px;
      z-index: 2;

      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 56px;
    }

    .info-box {
      width: 560px;
      max-width: 52vw;
      padding: 34px 40px;
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, 0.34);
      background: rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.27);
    }

    .name {
      margin: 0 0 30px;
      font-size: 2.1rem;
      font-weight: 750;
      line-height: 1.1;
      letter-spacing: -0.04em;
      color: rgba(255, 255, 255, 0.98);
    }

    .info-section {
      margin-bottom: 20px;
    }

    .info-section:last-child {
      margin-bottom: 0;
    }

    .label {
      display: block;
      margin-bottom: 7px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.56);
    }

    .content {
      font-size: 1.03rem;
      font-weight: 400;
      line-height: 1.75;
      letter-spacing: -0.02em;
      color: rgba(255, 255, 255, 0.96);
      word-break: keep-all;
    }

    .message {
      max-width: 680px;
      margin: 0;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: clamp(2.8rem, 5.5vw, 5.8rem);
      font-style: normal;
      font-weight: 800;
      line-height: 1.06;
      letter-spacing: -0.07em;
      text-align: right;
      color: rgba(255, 255, 255, 0.97);
      text-shadow: 0 16px 48px rgba(0, 0, 0, 0.34);
      word-break: keep-all;
    }

    @media (max-width: 900px) {
      .page {
        padding: 28px;
        overflow: visible;
      }

      .logo {
        top: 24px;
        left: 28px;
        font-size: 7.4rem;
      }

      .top-image {
        top: 28px;
        right: 28px;
        width: 104px;
        height: 104px;
        border-radius: 18px;
      }

      .bottom-area {
        position: relative;
        left: auto;
        right: auto;
        bottom: auto;
        min-height: 100vh;
        padding-top: 250px;
        flex-direction: column-reverse;
        align-items: stretch;
        justify-content: flex-end;
        gap: 28px;
      }

      .info-box {
        width: 100%;
        max-width: none;
        padding: 28px;
      }

      .message {
        max-width: 100%;
        text-align: left;
        font-size: 3.2rem;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="logo">HEE</div>

    <img class="top-image" src="./top-image.jpg" alt="오른쪽 상단 이미지" />

    <section class="bottom-area">
      <div class="info-box">
        <h1 class="name">윤희원</h1>

        <div class="info-section">
          <span class="label">Nickname</span>
          <div class="content">hee, 훤</div>
        </div>

        <div class="info-section">
          <span class="label">Favorite</span>
          <div class="content">하양색을 좋아합니다. 아주 많이.</div>
        </div>

        <div class="info-section">
          <span class="label">Mindset</span>
          <div class="content">확신 있는 사람이 되자. 모든 길에는 의미가 있다.</div>
        </div>

        <div class="info-section">
          <span class="label">Want</span>
          <div class="content">여유</div>
        </div>
      </div>

      <p class="message">
        확신 있는 사람이 되자.<br />
        모든 길에는 의미가 있다.
      </p>
    </section>
  </main>
</body>
</html>
