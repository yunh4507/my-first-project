<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>윤희원 | HEE</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Playfair+Display:ital,wght@1,500;1,700&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Noto Sans KR', sans-serif;
      color: white;
      background-color: #111;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.45)),
        url("./background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .page {
      position: relative;
      min-height: 100vh;
      padding: 48px;
    }

    .logo {
      position: absolute;
      top: 38px;
      left: 48px;
      font-size: clamp(5rem, 13vw, 12rem);
      font-weight: 900;
      letter-spacing: -0.08em;
      line-height: 0.85;
      color: rgba(255, 255, 255, 0.95);
    }

    .bottom-area {
      position: absolute;
      left: 48px;
      right: 48px;
      bottom: 48px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 40px;
    }

    .info-box {
      width: 420px;
      padding: 32px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .name {
      margin: 0 0 28px;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .info-section {
      margin-bottom: 20px;
    }

    .info-section:last-child {
      margin-bottom: 0;
    }

    .label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
    }

    .content {
      font-size: 1rem;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.96);
      word-break: keep-all;
    }

    .message {
      max-width: 560px;
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 6vw, 6rem);
      font-style: italic;
      font-weight: 700;
      line-height: 1.05;
      text-align: right;
      color: rgba(255, 255, 255, 0.96);
      text-shadow: 0 15px 45px rgba(0, 0, 0, 0.35);
    }

    @media (max-width: 768px) {
      body {
        min-height: auto;
      }

      .page {
        padding: 28px;
        min-height: 100vh;
      }

      .logo {
        top: 28px;
        left: 28px;
        font-size: 5.5rem;
      }

      .bottom-area {
        position: relative;
        left: auto;
        right: auto;
        bottom: auto;
        min-height: 100vh;
        padding-top: 220px;
        flex-direction: column-reverse;
        align-items: stretch;
        justify-content: flex-end;
      }

      .info-box {
        width: 100%;
        padding: 26px;
      }

      .message {
        max-width: 100%;
        text-align: left;
        font-size: 3.3rem;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="logo">HEE</div>

    <section class="bottom-area">
      <div class="info-box">
        <h1 class="name">윤희원</h1>

        <div class="info-section">
          <span class="label">Nickname</span>
          <div class="content">hee, 훤</div>
        </div>

        <div class="info-section">
          <span class="label">Favorite</span>
          <div class="content">하양색을 좋아합니다. 아주 많이.</div>
        </div>

        <div class="info-section">
          <span class="label">Mindset</span>
          <div class="content">확신 있는 사람이 되자. 모든 길에는 의미가 있다.</div>
        </div>

        <div class="info-section">
          <span class="label">Want</span>
          <div class="content">여유</div>
        </div>
      </div>

      <p class="message">
        모든 길에는<br />
        의미가 있다.
      </p>
    </section>
  </main>
</body>
</html>
